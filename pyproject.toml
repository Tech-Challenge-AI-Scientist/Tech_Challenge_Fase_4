[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tech_challenge_fase4"
dynamic = ["version"]
description = "Base de conhecimento (vector store) e LLM Gemini para RAG sobre avaliações da Olist."
authors = [
  { name = "Tech Challenge AI Scientist - Fase 4" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "google-genai>=1.30",
    "chromadb>=1.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["tech_challenge_fase4"]
force_sort_within_sections = true



[tool.pytest.ini_options]
testpaths = ["tests"]
